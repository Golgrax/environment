[project]
name = "environment_python"
version = "0.1.0"
description = "Python abstraction for environment management and metrics"
authors = [{ name = "Bekian" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages]
find = {where = ["."], include = ["environment*"]}

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["python"]

[tool.pytest.ini_options]
pythonpath = ["./environment"]

[tool.setuptools]
package-dir = { "" = "src" }
