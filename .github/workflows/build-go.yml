name: Build Go

on:
  push:
    branches:
      - canary
      - stable
  pull_request:
    branches:
      - canary
      - stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Test
        run: go test -v ./...
        working-directory: packages/go/environment
